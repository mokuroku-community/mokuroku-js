name: CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'packages/core/**'
      - 'packages/bullmq/**'
      - '.github/workflows/ci.yml'
      - 'package.json'
      - 'tsconfig.json'
      - 'turbo.json'
  pull_request:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: false
        default: 'develop'

jobs:

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
      - uses: ./.github/actions/setup-pnpm
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
      - uses: ./.github/actions/setup-pnpm
      - name: Lint
        run: pnpm lint
