name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  determine-affected:
    name: Determine affected packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
      should_run: ${{ steps.set-matrix.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            core:
              - 'packages/core/**'
            bullmq:
              - 'packages/bullmq/**'
            global:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'tsconfig.json'
              - 'turbo.json'
      - id: set-matrix
        run: |
          core_entry='{"id":"core","filter":"@mokurokujs/core"}'
          bullmq_entry='{"id":"bullmq","filter":"@mokurokujs/bullmq"}'
          selected=()

          if [[ "${{ steps.changes.outputs.global }}" == 'true' ]]; then
            selected+=("$core_entry" "$bullmq_entry")
          else
            if [[ "${{ steps.changes.outputs.core }}" == 'true' ]]; then
              selected+=("$core_entry")
            fi
            if [[ "${{ steps.changes.outputs.bullmq }}" == 'true' ]]; then
              selected+=("$bullmq_entry")
            fi
          fi

          if [[ ${#selected[@]} -eq 0 ]]; then
            {
              echo "should_run=false"
              echo "packages=[]"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=,
          {
            echo "should_run=true"
            echo "packages=[${selected[*]}]"
          } >> "$GITHUB_OUTPUT"
        shell: bash

  build:
    name: build (${{ matrix.pkg.id }})
    needs: determine-affected
    if: needs.determine-affected.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: ${{ fromJson(needs.determine-affected.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter "${{ matrix.pkg.filter }}" typecheck

  lint:
    name: lint (${{ matrix.pkg.id }})
    needs: determine-affected
    if: needs.determine-affected.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: ${{ fromJson(needs.determine-affected.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter "${{ matrix.pkg.filter }}" lint
