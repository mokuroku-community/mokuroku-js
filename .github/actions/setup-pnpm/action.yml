name: 'Setup pnpm'
description: 'Setup pnpm and node, optionally installing dependencies'
inputs:
  install:
    description: 'Set to false to skip pnpm install'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 10.33.4
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'pnpm'
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
